spring.application.name=csieventmangement

# ===============================
# DATABASE
# Credentials come ONLY from environment variables (set them in the Render
# dashboard). For local runs use the "local" profile, see README.md.
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# Load lazy associations in batches instead of one query per row (N+1 guard)
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.keepalive-time=120000
# Under a burst, wait in line for a connection instead of failing fast
spring.datasource.hikari.connection-timeout=30000

# ===============================
# JWT
# JWT_SECRET must be a base64/random string of at least 32 characters.
# Default lifetime is 7 days so students can log in before the event and
# are not all forced to log in at the same moment on event day.
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:604800000}

# ===============================
# SERVER
# ===============================
server.port=${PORT:8080}
server.shutdown=graceful
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/plain
server.compression.min-response-size=1024
server.forward-headers-strategy=framework
server.error.include-stacktrace=never

# Java 21 virtual threads: cheap per-request threads, so a burst of requests
# queues on the DB pool instead of exhausting memory on a small instance.
spring.threads.virtual.enabled=true
